<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minecraft Clicker - Login</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body data-title-key="loginPageTitle">

    <div class="lang-switch">
        <button type="button" data-lang="es" lang="es" aria-label="Español" aria-pressed="false">ES</button>
        <button type="button" data-lang="ca" lang="ca" aria-label="Català" aria-pressed="false">CA</button>
        <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
    </div>

    <div class="videoborder">
        <video src="../content/img/Video_background.mp4" autoplay loop muted playsinline preload="metadata"></video>
    </div>

    <div class="contenedor">
        <h1><span class="sr-only">Minecraft Clicker</span></h1>

        <form id="auth-section">
            <h2 data-i18n="authTitle"></h2>
            <input type="email" id="email" name="email" autocomplete="email" required data-i18n-placeholder="email" data-i18n-aria="email">
            <input type="password" id="password" name="password" autocomplete="current-password" minlength="6" required data-i18n-placeholder="password" data-i18n-aria="password">
            <button type="submit" id="btn-login" data-i18n="login"></button>
            <button type="button" id="btn-register" data-i18n="register"></button>
            <button type="button" id="btn-reset" class="link" data-i18n="forgot"></button>

            <button type="button" id="btn-google">
                <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.18v3.15C3.17 21.36 7.23 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.18C.43 8.08 0 9.79 0 12s.43 3.92 1.18 5.42l4.1-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.64 1.18 6.58l4.1 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                </svg>
                <span data-i18n="google"></span>
            </button>

            <p id="user-status" aria-live="polite"></p>
        </form>
    </div>

    <script type="module">
        import { setLang, getLang } from './js/i18n.js';
        setLang(getLang());
    </script>
    <script type="module" src="js/index.js"></script>
</body>
</html>
