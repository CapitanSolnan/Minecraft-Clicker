<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="title">Minecraft Clicker</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>

    <div class="videoborder">
        <video src="content/img/Video_background.mp4" autoplay loop muted playsinline preload="metadata"></video>
    </div>

    <div class="contenedor">
        <div class="topbar">
            <div class="topbar-info">
                <div class="timer"><span data-i18n="timer"></span> <span id="timer-value">0s</span></div>
                <div class="save-status" id="save-status" aria-live="polite"></div>
            </div>

            <div class="lang-switch">
                <button data-lang="es">ES</button>
                <button data-lang="ca">CA</button>
                <button data-lang="en">EN</button>
            </div>

            <div></div>
        </div>

        <h1><span class="sr-only">Minecraft Clicker</span></h1>

        <main class="juego">
            <div class="contenedor2">
                <button class="click" id="click" data-i18n-aria="mineAria"></button>
                <div class="contador" id="contador"></div>
                <div class="xseg" id="xseg"></div>
            </div>

            <div class="inventario">
                <div class="inv-header" data-i18n="inventory"></div>
                <div class="inv-grid" id="inv-grid"></div>
            </div>
        </main>

        <div class="acciones">
            <button class="logout" id="logout" data-i18n="logout"></button>
            <button class="guardar" id="guardar" data-i18n="save"></button>
        </div>
    </div>

    <script type="module" src="js/i18n.js"></script>
    <script type="module" src="js/game.js"></script>
</body>
</html>
