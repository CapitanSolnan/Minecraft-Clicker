name: Deploy Main and Legacy Pages

on:
  push:
    branches: [ main, legacy ]

jobs:
  deploy-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy Main to Root
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: . 
          destination_dir: . 

  deploy-legacy:
    if: github.ref == 'refs/heads/legacy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout legacy
        uses: actions/checkout@v4
        with:
          ref: legacy

      - name: Deploy Legacy to Subfolder
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: . 
          destination_dir: legacy 
