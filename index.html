<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <title>Minecraft Clicker</title>
</head>

<body>
    <div class="videoborder"><video src="img/Video.mp4" autoplay loop muted></video></div>
    <div class="contenedor">
        <h1></h1>
        <div class="timer" id="timer">Tiempo transcurrido: 0</div>
        <p class="div-cargar">Cargar Progreso</p>
        <button class="guardar" id="guardar">Guardar Progreso</button>
        <p class="div-guardar">Guardar Progreso</p>
        <input type="file" onchange="onChange(event)" class="cargar" id="cargar"></input>
        <div class="contenedor2">
            <div class="click" id="click"></div>
            <div class="contador" id="contador">0 ESMERALDAS</div>
            <div class="xseg" id="xseg">0 Clicks Pasivos</div>
            <p class="esmeralda" id="esmeralda" ></p>
        </div>
        <div class="mejoras">
            <div class="mej-tronco" id="mej-tronco">
                <div class="text-tronco" id="text-tronco">0 Mejora de Tronco</div>
                <button class="Comprar-tronco" id="Comprar-tronco">Comprar por 10.00 $</button>
                <button class="Vender-tronco" id="Vender-tronco">Vender por 5.00 $</button>
            </div>
            <div class="mej-piedra" id="mej-piedra">
                <div class="text-piedra" id="text-piedra">0 Mejora de Piedra</div>
                <button class="Comprar-piedra" id="Comprar-piedra"></button>
                <button class="Vender-piedra" id="Vender-piedra"></button>
            </div>
            <div class="mej-black-piedra"></div>
            <div class="mej-carbon" id="mej-carbon">
                <div class="text-carbon" id="text-carbon">0 Mejora de Carbón</div>
                <button class="Comprar-carbon" id="Comprar-carbon"></button>
                <button class="Vender-carbon" id="Vender-carbon"></button>
            </div>
            <div class="mej-black-carbon"></div>
            <div class="mej-hierro" id="mej-hierro">
                <div class="text-hierro" id="text-hierro">0 Mejora de Hierro</div>
                <button class="Comprar-hierro" id="Comprar-hierro"></button>
                <button class="Vender-hierro" id="Vender-hierro"></button>
            </div>
            <div class="mej-black-hierro"></div>
            <div class="mej-lapiz" id="mej-lapiz">
                <div class="text-lapiz" id="text-lapiz">0 Mejora de Lapizlazuli</div>
                <button class="Comprar-lapiz" id="Comprar-lapiz"></button>
                <button class="Vender-lapiz" id="Vender-lapiz"></button>
            </div>
            <div class="mej-black-lapiz"></div>
            <div class="mej-redstone" id="mej-redstone">
                <div class="text-redstone" id="text-redstone">0 Mejora de Redstone</div>
                <button class="Comprar-redstone" id="Comprar-redstone"></button>
                <button class="Vender-redstone" id="Vender-redstone"></button>
            </div>
            <div class="mej-black-redstone"></div>
            <div class="mej-oro" id="mej-oro">
                <div class="text-oro" id="text-oro">0 Mejora de Oro</div>
                <button class="Comprar-oro" id="Comprar-oro"></button>
                <button class="Vender-oro" id="Vender-oro"></button>
            </div>
            <div class="mej-black-oro"></div>
            <div class="mej-diamante" id="mej-diamante">
                <div class="text-diamante" id="text-diamante">0 Mejora de Diamante</div>
                <button class="Comprar-diamante" id="Comprar-diamante"></button>
                <button class="Vender-diamante" id="Vender-diamante"></button>
            </div>
            <div class="mej-black-diamante"></div>
            <div class="mej-obsidiana" id="mej-obsidiana">
                <div class="text-obsidiana" id="text-obsidiana">0 Mejora de Obsidiana</div>
                <button class="Comprar-obsidiana" id="Comprar-obsidiana"></button>
                <button class="Vender-obsidiana" id="Vender-obsidiana"></button>
            </div>
            <div class="mej-black-obsidiana"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
